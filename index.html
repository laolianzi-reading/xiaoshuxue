<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>小数学 · 芜湖中考数学145+提分工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d6fd6'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='Georgia'%3E%CF%802%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --sub:#86868b; --line:#e5e5ea;
  --primary:#007aff; --primary-d:#0056b3; --primary-l:#e8f0fe;
  --teal:#30b0c7; --teal-l:#e4f6fa;
  --ok:#34c759; --ok-l:#e6f9ec;
  --bad:#ff3b30; --bad-l:#ffefee;
  --warn:#ff9500; --warn-l:#fff4e5;
  --purple:#af52de; --purple-l:#f5ecfc;
  --shadow:0 2px 16px rgba(0,0,0,.05);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
a{color:inherit;text-decoration:none}
/* 桌面端：左侧边栏布局 */
.desktop-layout{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:0.5px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 10px 24px}
.sidebar .brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#007aff,#5ac8fa);display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:18px}
.sidebar .brand b{font-size:17px;font-weight:700}
.sidebar nav{display:flex;flex-direction:column;gap:2px}
.sidebar .nav-item{padding:10px 14px;border-radius:12px;font-size:14.5px;color:var(--sub);white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:10px}
.sidebar .nav-item:hover{background:rgba(0,122,255,.08);color:var(--ink)}
.sidebar .nav-item.on{background:var(--primary-l);color:var(--primary);font-weight:600}
.sidebar .nav-item .ni{font-size:18px;width:22px;text-align:center}
.main-area{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{max-width:1100px;margin:0 auto;padding:0 28px;width:100%}
/* 顶部用户栏 */
.topbar{position:sticky;top:0;z-index:50;background:rgba(245,245,247,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;height:60px}
.grade-switch{display:flex;gap:4px;background:rgba(142,142,147,.12);border-radius:10px;padding:3px}
.grade-switch button{border:0;background:transparent;padding:5px 14px;border-radius:8px;font-size:13px;color:var(--sub);cursor:pointer;font-family:inherit;transition:.15s}
.grade-switch button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.user-chip{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.user-chip .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#af52de,#5ac8fa);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600}
main{flex:1;padding:24px 0 100px}
.foot{padding:18px 0 30px;color:var(--sub);font-size:12px;text-align:center}
/* 移动端底部TabBar */
.tabbar{display:none}
/* ===== 通用组件 ===== */
h1.page-title{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
p.page-sub{color:var(--sub);font-size:14px;margin-bottom:20px}
.card{background:var(--card);border:none;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:12px;padding:10px 20px;font-size:15px;cursor:pointer;font-family:inherit;transition:.15s;line-height:1.4;font-weight:500}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-ok{background:var(--ok);color:#fff}
.btn-warn{background:var(--warn);color:#fff}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:10px}
.btn.on{border-color:var(--primary);background:var(--primary);color:#fff}
.btn-lg{padding:14px 28px;font-size:16px;border-radius:14px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:8px;background:rgba(142,142,147,.12);color:var(--sub);white-space:nowrap;font-weight:500}
.tag.hot{background:var(--warn-l);color:#b26a14}
.tag.basic{background:var(--primary-l);color:var(--primary)}
.tag.mid{background:var(--teal-l);color:#0b8a9e}
.tag.high{background:var(--bad-l);color:var(--bad)}
.tag.d1{background:var(--ok-l);color:#157a41}
.tag.d2{background:var(--ok-l);color:#157a41}
.tag.d3{background:var(--teal-l);color:#0b8a9e}
.tag.d4{background:var(--warn-l);color:#b26a14}
.tag.d5{background:var(--bad-l);color:var(--bad)}
.tag.correct{background:var(--ok-l);color:#157a41}
.tag.wrong{background:var(--bad-l);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:12px 22px;border-radius:14px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.2);max-width:86vw;backdrop-filter:blur(20px)}
.toast.show{opacity:1}
/* ===== 首页 ===== */
.hero{background:linear-gradient(135deg,#007aff 0%,#5ac8fa 100%);border-radius:var(--radius);padding:32px 28px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(0,122,255,.2)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero h1{font-size:26px;margin-bottom:8px;font-weight:700}
.hero p{opacity:.92;font-size:14px;max-width:640px}
.hero .cta{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.hero .btn{background:#fff;color:#007aff;font-weight:600}
.hero .btn.ghost{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.3)}
.sect{margin-top:28px}
.sect-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sect-h h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
.sect-h span{font-size:13px;color:var(--sub)}
.knowledge-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kn-card{border-left:none;border-top:3px solid var(--primary)}
.kn-card.teal{border-top-color:var(--teal)}
.kn-card.ok{border-top-color:var(--ok)}
.kn-card.warn{border-top-color:var(--warn)}
.kn-card h3{font-size:15px;margin-bottom:4px}
.kn-card p{font-size:13px;color:var(--sub)}
.mode-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.mode-card{position:relative;padding:24px;cursor:pointer;transition:.2s}
.mode-card:hover{box-shadow:0 8px 28px rgba(0,0,0,.1);transform:translateY(-2px)}
.mode-card .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:24px}
.mode-card h3{font-size:16px;margin-bottom:5px}
.mode-card p{font-size:13px;color:var(--sub);min-height:38px}
.mode-card .go{margin-top:12px;font-size:14px;color:var(--primary);font-weight:600}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat-card{text-align:center;padding:20px 10px}
.stat-card b{display:block;font-size:28px;color:var(--ink);line-height:1.2;font-weight:700}
.stat-card span{font-size:13px;color:var(--sub)}
/* ===== 选择器 ===== */
.step-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step-tabs .step{font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);padding:4px 12px;border-radius:20px}
.step-tabs .step.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pick-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.pick-item{border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.12s;background:#fff}
.pick-item:hover{border-color:var(--primary)}
.pick-item.on{border-color:var(--primary);background:var(--primary-l)}
.pick-item b{display:block;font-size:14.5px}
.pick-item span{font-size:12px;color:var(--sub)}
.pick-item .cnt{font-size:11px;color:var(--sub);margin-top:4px}
.chapter-item{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* ===== 答题 ===== */
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.quiz-progress{font-size:13px;color:var(--sub)}
.quiz-progress b{color:var(--primary-d)}
.q-card{padding:28px}
.q-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.q-stem{font-size:17px;line-height:1.8;margin-bottom:20px;white-space:pre-wrap}
.q-stem .qno{display:inline-block;background:var(--primary);color:#fff;border-radius:8px;font-size:14px;padding:2px 10px;margin-right:8px;vertical-align:2px}
sup{font-size:.65em;vertical-align:super;line-height:0}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer;font-size:15px;transition:.12s;display:flex;gap:10px;align-items:flex-start;background:#fff}
.opt:hover{border-color:var(--primary)}
.opt .k{font-weight:600;color:var(--sub);flex-shrink:0;width:24px}
.opt.on{border-color:var(--primary);background:var(--primary-l)}
.opt.on .k{color:var(--primary)}
.q-input{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);transition:.12s}
.q-input:focus{outline:none;border-color:var(--primary)}
textarea.q-input{min-height:110px;resize:vertical;line-height:1.7}
.sym-pad{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sym-pad button{min-width:38px;height:32px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:15px;font-family:inherit;cursor:pointer;transition:.12s}
.sym-pad button:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-l)}
#cRadar{width:100%;max-width:340px;display:block;margin:0 auto}
#cTrend{width:100%;display:block}
.quiz-nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.q-num-dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.q-dot{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:12px;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer}
.q-dot.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.q-dot.done{background:var(--primary-l);border-color:var(--primary);color:var(--primary-d)}
/* ===== 结果 ===== */
.score-hero{text-align:center;padding:30px 20px;margin-bottom:16px}
.score-hero .num{font-size:52px;font-weight:800;color:var(--primary-d);line-height:1.2}
.score-hero .num small{font-size:22px;color:var(--sub);font-weight:400}
.score-hero .grade-line{margin-top:8px;font-size:14px;color:var(--sub)}
.res-item{border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin-bottom:12px;background:#fff}
.res-item .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.res-item .q{font-size:14px;line-height:1.7}
.res-line{font-size:13px;margin:5px 0}
.res-line b{font-weight:600}
.detail-box{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.detail-box summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--primary-d);user-select:none}
.detail-box .body{margin-top:8px;font-size:13.5px;line-height:1.85;color:#2b3a4c}
.detail-box .body .pts{margin-top:8px}
.detail-box .body .pts li{margin-left:18px;margin-bottom:3px}
.pt-check{display:flex;align-items:flex-start;gap:9px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:#fafcfe;font-size:13.5px;cursor:pointer}
.pt-check input{margin-top:4px;accent-color:var(--primary)}
.pt-check .pv{margin-left:auto;color:var(--primary-d);font-weight:600;white-space:nowrap}
/* ===== 模考 ===== */
.exam-note{font-size:13.5px;color:var(--sub);margin-top:10px;line-height:1.9}
.exam-note b{color:var(--ink)}
.timer-pill{background:#1b2838;color:#fff;padding:6px 14px;border-radius:20px;font-size:14px;font-variant-numeric:tabular-nums}
.timer-pill.warn{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.sec-title{font-size:15px;font-weight:700;margin:26px 0 12px;padding:8px 14px;background:var(--primary-l);color:var(--primary-d);border-radius:9px}
.exam-q{margin-bottom:22px}
.exam-q .qno{font-weight:700;color:var(--primary-d);margin-bottom:6px}
/* ===== 错题本 / 报告 ===== */
.wrong-item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff}
.wrong-item .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.wrong-item .q{font-size:13.5px;margin-top:6px;line-height:1.7}
.wrong-item .acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chart-box{position:relative;width:100%}
.chart-box canvas{width:100%;display:block}
.radar-wrap{display:flex;align-items:center;justify-content:center;padding:8px}
.weak-list li{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:13.5px}
.weak-list li:last-child{border-bottom:0}
.weak-list .pct{color:var(--bad);font-weight:600}
.bar-cell{display:grid;grid-template-columns:130px 1fr 46px;gap:10px;align-items:center;margin-bottom:9px;font-size:12.5px}
.bar-cell .track{background:#eef3f9;border-radius:6px;height:14px;overflow:hidden}
.bar-cell .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#1d6fd6,#4aa3e8);transition:width .5s}
.bar-cell .fill.bad{background:linear-gradient(90deg,#d64545,#ef8b6b)}
.sug-list li{font-size:13.5px;margin:7px 0 7px 18px;line-height:1.7}
.empty{padding:44px 20px;text-align:center;color:var(--sub)}
.empty .big{font-size:40px;margin-bottom:10px;color:#c4d2e0}
/* 响应式 */
@media(max-width:820px){
  .sidebar{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;height:83px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid var(--line);z-index:100;padding-top:8px;justify-content:space-around}
  .tabbar .tab-item{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--sub);gap:2px}
  .tabbar .tab-item.on{color:var(--primary)}
  .tabbar .tab-item .ti{font-size:22px}
  main{padding-bottom:110px}
  .wrap{padding:0 16px}
  h1.page-title{font-size:22px}
  .hero{padding:24px 20px}
  .hero h1{font-size:21px}
  .bar-cell{grid-template-columns:92px 1fr 40px}
}
</style>

<script>
'use strict';
// error handler in head
/* ============================================================
   题库数据（原创变式题，对标《实验班提优训练》基础提优层与
   《学霸》拔高层出题逻辑，全部为自主原创，规避版权风险）
   题型 t: c=选择 f=填空 a=解答
   d: 难度1-5  l: 层级  k: 知识点  dom: 知识领域
   h: 芜湖中考高频标记  trap: 陷阱类型标签
   p: 解答题得分要点 [[说明,分值],...]
============================================================ */


/* ============ 基础工具 ============ */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUP_MAP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
const fmtMath=s=>{if(!s)return '';let h=esc(s);for(const k in SUP_MAP)h=h.split(k).join('<sup>'+SUP_MAP[k]+'</sup>');return h;};
const fmtDate=ts=>{const d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
let toastTimer=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}

/* ============ 本地存储 ============ */
const DBK='xiaoshuxue_wuhu_v1';
const DBK2='xiaoshuxue_wuhu_v2';
const store={
  data:null,
  cur:null,
  emptyUser(){return {profile:{name:'',grade:'g9'},records:[],wrongs:{},sessions:[],points:null};},
  migrate(){
    let old=null;try{old=JSON.parse(localStorage.getItem(DBK))}catch(e){old=null}
    const uid='u'+Date.now().toString(36);
    const d={};d[uid]=(old&&(Array.isArray(old.records)||Array.isArray(old.sessions)||old.wrongs))?old:this.emptyUser();
    return {users:[{id:uid,name:'默认用户',createdAt:Date.now()}],active:uid,data:d};
  },
  load(){try{this.data=JSON.parse(localStorage.getItem(DBK2))}catch(e){this.data=null}
    if(!this.data){this.data=this.migrate();}
    if(!this.data.users||!this.data.users.length){this.data=this.migrate();}
    this.data.data=this.data.data||{};
    if(!this.data.data[this.data.active])this.data.active=this.data.users[0].id;
    this.data.data[this.data.active]=this.data.data[this.data.active]||this.emptyUser();
    this._fixMojibake();
    this.cur=this.data.data[this.data.active];
    this.save();
    return this.cur;},
  _fixMojibake(){
    const fix=s=>{if(typeof s!=='string'||!s)return s;if(!/[\u00c0-\u00ff]/.test(s))return s;try{const bytes=new Uint8Array(s.length);for(let i=0;i<s.length;i++)bytes[i]=s.charCodeAt(i)&0xFF;const f=new TextDecoder('utf-8',{fatal:false}).decode(bytes);if(f!==s)return f;}catch(e){}return s;};
    const walk=o=>{if(typeof o==='string')return fix(o);if(Array.isArray(o))return o.map(walk);if(o&&typeof o==='object'){for(const k in o)o[k]=walk(o[k]);}return o;};
    walk(this.data);
  },
  save(){try{localStorage.setItem(DBK2,JSON.stringify(this.data));}catch(e){console.warn('保存失败',e);}},
  reset(){const c=this.cur,e=this.emptyUser();c.profile=e.profile;c.records=e.records;c.wrongs=e.wrongs;c.sessions=e.sessions;if('md' in c)delete c.md;if('lastSet' in c)delete c.lastSet;this.save();},
  listUsers(){return this.data.users.slice();},
  curUser(){return this.data.users.find(u=>u.id===this.data.active)||this.data.users[0];},
  addUser(name){
    const uid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    this.data.users.push({id:uid,name:(name&&String(name).trim())||('用户'+(this.data.users.length+1)),createdAt:Date.now()});
    this.data.data[uid]=this.emptyUser();
    this.save();return uid;},
  switchUser(id){
    if(!this.data.data[id])return false;
    this.data.active=id;this.cur=this.data.data[id];D=this.cur;this.save();return true;},
  delUser(id){
    if(this.data.users.length<=1||!this.data.data[id])return false;
    this.data.users=this.data.users.filter(u=>u.id!==id);
    delete this.data.data[id];
    if(this.data.active===id){this.data.active=this.data.users[0].id;this.cur=this.data.data[this.data.active];}
    this.save();return true;},
  exportUser(id){
    const uid=id||this.data.active;
    const u=this.data.users.find(x=>x.id===uid);
    const d=this.data.data[uid]||{};
    const o={app:'xiaoshuxue_wuhu',ver:2,exportedAt:Date.now(),user:u?{id:uid,name:u.name,createdAt:u.createdAt}:{id:uid,name:'用户'}};
    o.data={profile:d.profile||{},records:d.records||[],wrongs:d.wrongs||{},sessions:d.sessions||[]};
    if('md' in d)o.data.md=d.md;
    if(d.points&&typeof d.points==='object')o.data.points=d.points;
    return JSON.stringify(o,null,1);},
  importUser(text){
    let o=null;try{o=JSON.parse(text)}catch(e){throw new Error('文件不是有效的 JSON');}
    if(!o||o.app!=='xiaoshuxue_wuhu'||!o.data||typeof o.data!=='object')throw new Error('不是小数学学情数据文件');
    const uid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const name=(o.user&&o.user.name&&String(o.user.name).trim())||'导入用户';
    this.data.users.push({id:uid,name:name,createdAt:Date.now(),importedAt:Date.now()});
    const d=this.emptyUser();
    if(o.data.profile&&typeof o.data.profile==='object')d.profile=o.data.profile;
    if(Array.isArray(o.data.records))d.records=o.data.records;
    if(o.data.wrongs&&typeof o.data.wrongs==='object')d.wrongs=o.data.wrongs;
    if(Array.isArray(o.data.sessions))d.sessions=o.data.sessions;
    if(o.data.md&&typeof o.data.md==='object')d.md=o.data.md;
    if(o.data.points&&typeof o.data.points==='object')d.points=o.data.points;
    this.data.data[uid]=d;
    this.save();return uid;}
};

/* ============ 积分系统（独立于学情，随用户隔离/导入导出） ============ */
function ptsInit(){return {total:0,streak:0,last:null,ms:{7:0,30:0,90:0},logs:[]};}
function ptsGet(){if(!D.points||typeof D.points!=='object'){D.points=ptsInit();}return D.points;}
function ptsDateStr(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function ptsToday(){return ptsDateStr(new Date());}
function ptsYesterday(){const d=new Date();d.setDate(d.getDate()-1);return ptsDateStr(d);}
function ptsAdd(n,note,t){const p=ptsGet();p.total+=n;p.logs.push({t:t||'gain',date:Date.now(),pts:n,note:note||''});}
function checkin(){
  const p=ptsGet();const today=ptsToday();
  if(p.last===today)return {ok:false,msg:'今日已签到，明天再来吧'};
  p.streak=(p.last===ptsYesterday())?(p.streak+1):1;
  p.last=today;
  const daily=p.streak<=3?2:(p.streak<=10?5:(p.streak<=14?8:10));
  ptsAdd(daily,'每日签到 · 连续第 '+p.streak+' 天','checkin');
  let msPts=0,msNote=[];
  if(p.streak===7&&!p.ms[7]){p.ms[7]=1;msPts+=50;msNote.push('连续7天里程碑+50');}
  if(p.streak===30&&!p.ms[30]){p.ms[30]=1;msPts+=300;msNote.push('连续30天里程碑+300');}
  if(p.streak===90&&!p.ms[90]){p.ms[90]=1;msPts+=1000;msNote.push('连续90天里程碑+1000');}
  if(msPts>0)ptsAdd(msPts,msNote.join('、'),'milestone');
  store.save();
  return {ok:true,daily:daily,streak:p.streak,msPts:msPts,total:p.total};
}
function checkinBtn(){const r=checkin();toast(r.ok?('签到成功：+'+r.daily+' 积分'+(r.msPts?'，里程碑额外 +'+r.msPts+' 积分':'')):r.msg);render('users');}
function clearPointsAsk(){
  const p=ptsGet();if(p.total<=0){toast('当前积分为 0，无需清零');return;}
  if(!confirm('确定一键清零积分？当前 '+p.total+' 积分将归零。清零事件将永久保留在积分明细中，连续签到天数与里程碑领取状态不受影响。'))return;
  const before=p.total;p.total=0;
  p.logs.push({t:'clear',date:Date.now(),pts:0,note:'一键清零',before:before});
  store.save();render('users');toast('积分已清零（原 '+before+' 积分）');
}
function ptsExamReward(score,max){
  if(max===100){if(score>=100)return 100;if(score>=90)return Math.ceil(score/2);if(score>=80)return Math.ceil(score/3);return 0;}
  if(max===150){if(score>=150)return 200;if(score>=135)return Math.ceil(score/2);if(score>=120)return Math.ceil(score/3);return 0;}
  return 0;
}

/* ============ 数学表达式解析与等价比对（纯本地，无 eval） ============ */
function cleanEqSide(t){return String(t).replace(/^[a-zA-Z]+\(?x?\)?=/,'');}
function exprTokens(s){
  const sup={'\u2070':'0','\u00b9':'1','\u00b2':'2','\u00b3':'3','\u2074':'4','\u2075':'5','\u2076':'6','\u2077':'7','\u2078':'8','\u2079':'9','\u207b':'-','\u207a':'+','\u207d':'(','\u207e':')'};
  let out='';
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(sup[c]!==undefined){
      out+='^(';
      while(i<s.length&&sup[s[i]]!==undefined){out+=sup[s[i]];i++;}
      out+=')';i--;
    }else out+=c;
  }
  // \u221a 后若无括号，自动包成 sqrt(...)
  out=out.replace(/\u221a(?![()])([0-9a-zA-Z\u03c0.\u2070-\u2079]+)/g,'sqrt($1)');
  return out;
}
function parseExpr(s){
  let i=0;const toks=[];
  const isDig=c=>c>='0'&&c<='9';
  while(i<s.length){
    const c=s[i];
    if(c===' '||c==='\u3000'){i++;continue;}
    if(isDig(c)||c==='.'){
      let j=i,dot=false;
      while(j<s.length&&(isDig(s[j])||(s[j]==='.'&&!dot))){if(s[j]==='.')dot=true;j++;}
      toks.push({t:'num',v:parseFloat(s.slice(i,j))});i=j;continue;
    }
    if(/[a-zA-Z]/.test(c)){
      let j=i;while(j<s.length&&/[a-zA-Z]/.test(s[j]))j++;
      const w=s.slice(i,j).toLowerCase();
      if(w==='sqrt'||w==='abs')toks.push({t:'fn',v:w});
      else if(w==='pi'||w==='\u03c0')toks.push({t:'num',v:Math.PI});
      else if(w==='e')toks.push({t:'num',v:Math.E});
      else toks.push({t:'var',v:w});
      i=j;continue;
    }
    if(c==='\u03c0'){toks.push({t:'num',v:Math.PI});i++;continue;}
    if(c==='-'||c==='+'){
      if(c==='-'){
        const pr=toks[toks.length-1];
        if(!pr||pr.t==='op'||pr.t==='lp'||pr.t==='fn'){toks.push({t:'op',v:'neg'});i++;continue;}
      }
      toks.push({t:'op',v:c});i++;continue;
    }
    if('*/^'.indexOf(c)>=0){toks.push({t:'op',v:c});i++;continue;}
    if(c==='('||c===')'){toks.push({t:c==='('?'lp':'rp'});i++;continue;}
    if(c==='\u00d7'){toks.push({t:'op',v:'*'});i++;continue;}
    if(c==='\u00f7'){toks.push({t:'op',v:'/'});i++;continue;}
    if(c==='\u221a'){toks.push({t:'fn',v:'sqrt'});i++;continue;}
    if(c==='|'){toks.push({t:'fn',v:'abs'});i++;continue;}
    if(c==='%'){toks.push({t:'op',v:'%'});i++;continue;}
    i++;
  }
  const out=[],st=[];
  const prec={'+':1,'-':1,'*':2,'/':2,'%':2,'^':3,'neg':0};
  const isOp=t=>t&&t.t==='op';
  const imp=toks.slice();
  toks.length=0;
  for(let k=0;k<imp.length;k++){
    const tk=imp[k],pv=toks[toks.length-1];
    if(pv&&(pv.t==='num'||pv.t==='var'||pv.t==='rp')&&(tk.t==='var'||tk.t==='num'||tk.t==='lp'||tk.t==='fn'))toks.push({t:'op',v:'*'});
    toks.push(tk);
  }
  for(const tk of toks){
    if(tk.t==='num'||tk.t==='var')out.push(tk);
    else if(tk.t==='fn')st.push(tk);
    else if(tk.t==='op'){
      if(tk.v==='neg'){st.push(tk);continue;}
      while(isOp(st[st.length-1])&&(tk.v==='^'?prec[st[st.length-1].v]>prec[tk.v]:prec[st[st.length-1].v]>=prec[tk.v]))out.push(st.pop());
      st.push(tk);
    }
    else if(tk.t==='lp')st.push(tk);
    else if(tk.t==='rp'){
      while(st.length&&st[st.length-1].t!=='lp')out.push(st.pop());
      if(st.length)st.pop();
      if(st.length&&st[st.length-1].t==='fn')out.push(st.pop());
    }
  }
  while(st.length)out.push(st.pop());
  const vars=[...new Set(out.filter(t=>t.t==='var').map(t=>t.v))];
  return {rpn:out,vars};
}
function evalRPN(rpn,vars){
  const st=[];
  for(const tk of rpn){
    if(tk.t==='num')st.push(tk.v);
    else if(tk.t==='var')st.push(vars[tk.v]!==undefined?vars[tk.v]:0);
    else if(tk.t==='fn'){
      const x=st.pop();if(x===undefined)return null;
      st.push(tk.v==='sqrt'?Math.sqrt(Math.max(0,x)):Math.abs(x));
    }
    else if(tk.t==='op'&&tk.v==='neg'){
      const x=st.pop();if(x===undefined)return null;st.push(-x);
    }
    else if(tk.t==='op'){
      const b=st.pop(),a=st.pop();if(a===undefined||b===undefined)return null;
      let r;
      switch(tk.v){
        case '+':r=a+b;break;case '-':r=a-b;break;case '*':r=a*b;break;
        case '/':if(Math.abs(b)<e-12)return null;r=a/b;break;
        case '%':r=a*b/100;break;
        case '^':r=Math.pow(a,b);break;
      }
      if(!isFinite(r))return null;st.push(r);
    }
  }
  return st.length?st[st.length-1]:null;
}
function exprEq(a,b){
  a=cleanEqSide(a);b=cleanEqSide(b);
  if(/[<>＜＞≤≥°%∶:]/.test(a)||/[<>＜＞≤≥°%∶:]/.test(b))return false;
  const pa=parseExpr(exprTokens(a)),pb=parseExpr(exprTokens(b));
  if(!pa||!pb)return false;
  const va=pa.vars,vb=pb.vars;
  if(va.length!==vb.length||va.some(v=>vb.indexOf(v)<0))return false;
  const vars=va;
  const samp=[-1.7,0.4,2.3,5.1,-3.2];
  if(!vars.length)samp.length=1;
  for(const t of samp){
    const vs={};vars.forEach(v=>vs[v]=t);
    const x=evalRPN(pa.rpn,vs),y=evalRPN(pb.rpn,vs);
    if(x===null||y===null||Math.abs(x-y)>e-6)return false;
  }
  return true;
}

function norm(v){return String(v||'').replace(/[\s\u3000,，;；、]/g,'').replace(/（/g,'(').replace(/）/g,')').replace(/−/g,'-').replace(/＋/g,'+').replace(/－/g,'-').replace(/∶/g,':').replace(/×/g,'*').replace(/÷/g,'/').replace(/＞/g,'>').replace(/＜/g,'<').replace(/>=/g,'≥').replace(/<=/g,'≤').replace(/大于等于/g,'≥').replace(/小于等于/g,'≤').replace(/不等于/g,'≠').replace(/大于/g,'>').replace(/小于/g,'<').replace(/(\d)度/g,'$1°').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,c=>'^'+'0123456789'['⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c)]).toLowerCase();}
function fillOk(q,v){
  const n=norm(v);if(!n)return false;
  const a=norm(q.a);
  if(n===a)return true;
  if(q.acc){for(const x of q.acc){if(norm(x)===n)return true;}}
  if(a.indexOf('或')>=0){if(a.split('或').some(p=>p&&(norm(p)===n||cleanEqSide(norm(p))===n)))return true;}
  if(q.acc){for(const x of q.acc){const nx=norm(x);if(nx.indexOf('或')>=0&&nx.split('或').some(p=>p&&(p===n||cleanEqSide(p)===n)))return true;}}
  const m=a.match(/^(.*?)±(.+)$/);
  if(m){const l=m[1],r=m[2];if(n===l+r||n===l+'-'+r||n===l+'−'+r)return true;}
  try{if(exprEq(a,n))return true;}catch(e){}
  return false;
}
function ansKeyNums(txt){
  const m=String(txt||'').match(/-?\d+(\.\d+)?(\/\d+(\.\d+)?)?/g)||[];
  return [...new Set(m.filter(x=>{const v=parseFloat(x);return Math.abs(v)>=2;}))];
}
function autoGradeAns(q,v){
  const pts=q.p||[];
  const max=pts.reduce((s,x)=>s+x[1],0);
  const nv=norm(v); if(!nv) return {ok:false,score:0,max,hitIdx:[]};
  const ans=norm(q.a);
  let conclusion=false;
  try{ conclusion=fillOk({a:q.a}, v); }catch(e){}
  if(!conclusion){
    const an=ansKeyNums(ans);
    if(an.length) conclusion=an.every(t=>nv.indexOf(t)>=0);
  }
  const hitIdx=[]; let step=0;
  pts.forEach((pt,i)=>{
    const nums=ansKeyNums(pt[0]);
    if(nums.length && nums.some(t=>nv.indexOf(t)>=0)){ step+=pt[1]; hitIdx.push(i); }
  });
  let score=step;
  if(conclusion){
    const li=pts.length-1;
    if(li>=0 && hitIdx.indexOf(li)<0){ score+=pts[li][1]; hitIdx.push(li); }
    score=max;
  }
  score=Math.max(0,Math.min(max,score));
  return {ok:score>=max,score,max,hitIdx};
}
function gradeQ(q,v,selfPts){
  const sec=q.sec,secPts=(sec&&typeof sec.pts==='number')?sec.pts:0;
  if(q.t==='c'){const ok=v===q.a;const mx=secPts||4;return {ok,score:ok?mx:0,max:mx};}
  if(q.t==='f'){const ok=fillOk(q,v);const mx=secPts||5;return {ok,score:ok?mx:0,max:mx};}
  if(q.t==='a') return autoGradeAns(q,v);
  const max=(q.p||[]).reduce((s,x)=>s+x[1],0);
  const score=Math.max(0,Math.min(max,selfPts||0));
  return {ok:score>=max,score,max};
}

    total+=g.max;score+=g.score;if(g.ok)correct++;
    const recIdx=D.records.length;
    D.records.push({ts:Date.now(),src:sess.src,mode:sess.mode,cat:q.cat,qid,type:q.t,ok:g.ok,score:g.score,max:g.max,dom:q.dom,kp:q.k,m:q.m||null,f:q.f||null,trap:q.trap||null,grade:q.grade});
    if(!g.ok){const w=D.wrongs[qid]||{n:0,last:0,ok:false};w.n++;w.last=Date.now();w.ok=false;D.wrongs[qid]=w;}
    if(g.ok){if(q.l==='提优')gainPts+=2;else if(q.l==='拔高')gainPts+=3;}
    res[res.length-1].recIdx=recIdx;
  });
  const sessIdx=D.sessions.length;
  D.sessions.push({ts:Date.now(),mode:sess.mode,title:sess.title,total,correct,score,max:total});
  if(gainPts>0)ptsAdd(gainPts,'刷题奖励：答对提优/拔高题','gain');
  if(sess.mode==='exam'){const paperMax=sess.paperMax||total;const paperScore=total>0?Math.round(score*paperMax/total):0;const exPts=ptsExamReward(paperScore,paperMax);if(exPts>0)ptsAdd(exPts,'套卷模考得分奖励（卷面 '+paperScore+'/'+paperMax+'）','gain');}
  store.save();
  const out={res,total,score,correct,sessIdx};
  sess=null;return out;
}

function avatarUpload(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');c.width=64;c.height=64;
      const ctx=c.getContext('2d');
      const s=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,64,64);
      const av=c.toDataURL('image/png');
      store.curUser().avatar=av;
      store.cur.avatar=av;
      store.save();updateNavUser();toast('头像已更新');render('users');
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(f);
}

function fitCanvas(cv){
  const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;
  const w=Math.max(10,Math.round(r.width)),h=Math.max(10,Math.round(r.height));
  if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr;}
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return {ctx,w,h};
}
function chartRadar(cv,labels,vals){
  const {ctx,w,h}=fitCanvas(cv);ctx.clearRect(0,0,w,h);
  const n=labels.length,cx=w/2,cy=h/2;
  if(n===0)return;
  const R=Math.max(40,Math.min(w,h)/2-30);
  ctx.strokeStyle='#dbe4ee';ctx.fillStyle='#5c6b7c';ctx.font='12px sans-serif';
  for(let ring=1;ring<=4;ring++){
    const rr=R*ring/4;ctx.beginPath();
    for(let i=0;i<=n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();
  }
  labels.forEach((lb,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n;
    let x=cx+(R+16)*Math.cos(a),y=cy+(R+16)*Math.sin(a);
    x=Math.max(6,Math.min(w-6,x));y=Math.max(10,Math.min(h-6,y));
    ctx.textAlign=x<24?'left':x>w-24?'right':'center';
    ctx.fillText(lb,x,y+(lb.length>2?3:0));
  });
  ctx.textAlign='center';
  ctx.beginPath();
  vals.forEach((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+R*v*Math.cos(a),y=cy+R*v*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.closePath();ctx.fillStyle='rgba(29,111,214,.18)';ctx.fill();ctx.strokeStyle='#d6fd6';ctx.lineWidth=2;ctx.stroke();
  vals.forEach((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+R*v*Math.cos(a),y=cy+R*v*Math.sin(a);ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fillStyle='#d6fd6';ctx.fill();});
}
function chartBars(cv,labels,vals,color,badIdx){
  const {ctx,w,h}=fitCanvas(cv);ctx.clearRect(0,0,w,h);
  if(!labels.length)return;
  const shown=labels.slice(0,12),svals=vals.slice(0,12),sbad=badIdx?badIdx.filter(i=>i<12):badIdx;
  const padL=76,padR=44,bh=Math.max(16,Math.min(22,(h-30)/Math.max(shown.length,1))),gap=Math.max(4,bh*0.4),top=10;
  const plotW=w-padL-padR;
  const startY=top;
  const maxV=Math.max(...svals,1);
  ctx.font='11px sans-serif';ctx.textBaseline='middle';
  shown.forEach((lb,i)=>{
    const y=startY+i*(bh+gap);
    ctx.textAlign='right';ctx.fillStyle='#5c6b7c';
    let name=String(lb); if(name.length>8)name=name.slice(0,8);
    ctx.fillText(name,padL-8,y+bh/2);
    const bw=Math.max(2,plotW*(svals[i]/maxV));
    ctx.fillStyle=(sbad&&sbad.includes(i))?'#d64545':'#d6fd6';
    ctx.beginPath();ctx.roundRect?ctx.roundRect(padL,y,bw,bh,5):ctx.rect(padL,y,bw,bh);ctx.fill();
    ctx.fillStyle='#5c6b7c';ctx.font='10px sans-serif';ctx.textAlign='left';
    ctx.fillText(svals[i]+'%',padL+bw+6,y+bh/2);
    ctx.font='11px sans-serif';
  });
  if(labels.length>12){ctx.fillStyle='#93a2b2';ctx.font='10.5px sans-serif';ctx.textAlign='right';ctx.fillText('…共 '+labels.length+' 项',w-4,h-4);}
}
function chartLine(cv,labels,vals){
  const {ctx,w,h}=fitCanvas(cv);ctx.clearRect(0,0,w,h);
  if(!labels.length)return;
  const padL=34,padB=26,padT=12,padR=10;
  const maxV=100,minV=0;
  const x0=padL,x1=w-padR,y0=padT,y1=h-padB;
  const px=i=>x0+(i/(labels.length-1||1))*(x1-x0);
  const py=v=>y1-(v-minV)/(maxV-minV)*(y1-y0);
  ctx.strokeStyle='#dbe4ee';ctx.fillStyle='#93a2b2';ctx.font='10.5px sans-serif';ctx.textAlign='right';
  [0,25,50,75,100].forEach(v=>{ctx.beginPath();ctx.moveTo(x0,py(v));ctx.lineTo(x1,py(v));ctx.stroke();ctx.fillText(v+'%',x0-5,py(v));});
  ctx.textAlign='center';ctx.textBaseline='top';
  labels.forEach((lb,i)=>{if(labels.length>9&&i%2)return;const x=Math.max(x0,Math.min(x1,px(i)));ctx.fillText(lb,x,y1+7);});
  ctx.strokeStyle='#0e8f7c';ctx.lineWidth=2;ctx.beginPath();
  vals.forEach((v,i)=>{const x=px(i),y=py(Math.max(0,Math.min(100,v)));i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.stroke();
  vals.forEach((v,i)=>{ctx.beginPath();ctx.arc(px(i),py(Math.max(0,Math.min(100,v))),3,0,7);ctx.fillStyle='#0e8f7c';ctx.fill();});
  ctx.textBaseline='alphabetic';
}

/* ============ 智能组卷引擎 ============
   算法组合（全部本地运行，读取 localStorage 错题记录）：
   ① 薄弱标签池：错题的知识点/模型/特征标签进入薄弱池，优先抽取匹配题
   ② 错题频次配额：按薄弱模型答错次数分配单次练习配额
   ③ 遗忘曲线：距上次做错越久权重越低；连续答对≥2 次再降权；≥3 次且超 7 天视为已掌握
   ④ 相似度匹配：知识点 + 模型 + 题型特征（多步计算/分类讨论/辅助线构造/新定义等）双匹配
   ⑤ 混入比例：薄弱题占比可配置（默认 40%），其余为全新普通题，避免全部同类
   ⑥ 新鲜度：上次抽过的题本次降权，避免连续重复 */
function weakProfile(){
  const now=Date.now();
  const kp={},md={},ft={},qErr={};
  D.records.forEach(r=>{
    if(r.ok)return;
    kp[r.kp]=(kp[r.kp]||0)+1;
    if(r.m)md[r.m]=(md[r.m]||0)+1;
    (r.f||[]).forEach(x=>ft[x]=(ft[x]||0)+1);
    const e=qErr[r.qid]||{n:0,last:0};e.n++;e.last=Math.max(e.last,r.ts);qErr[r.qid]=e;
  });
  return {kp,md,ft,qErr,now};
}
function decayByDays(days){return days<=1?1:days<=3?0.75:days<=7?0.45:0.25;}
function recentOkCount(qid){
  let n=0;const rs=D.records.filter(r=>r.qid===qid).slice(-5);
  for(let i=rs.length-1;i>=0&&rs[i].ok;i--)n++;
  return n;
}
function weakScore(q,p){
  let s=0;const e=p.qErr[q.id];
  if(e){
    s+=6+Math.min(6,e.n*2);           // 直接错题：次数越多权重越高
    s*=decayByDays((p.now-e.last)/864e5); // 遗忘曲线衰减
    const rok=recentOkCount(q.id);
    if(rok>=2)s*=0.4;                  // 近期连续答对，接近掌握
    if(rok>=3&&(p.now-e.last)>7*864e5)return 0; // 已掌握，退出薄弱池
  }
  const sk=p.kp[q.k]||0;
  const sm=q.m?p.md[q.m]||0:0;
  let sf=0;(q.f||[]).forEach(x=>{sf=Math.max(sf,p.ft[x]||0);});
  s+=sk*1.2+sm*1.6+sf*1.3;             // 标签相似度匹配（模型权重最高）
  return Math.round(s*100)/100;
}
function pickWeighted(pool,k){
  const out=[];const p=pool.slice();
  for(let i=0;i<k&&p.length;i++){
    let tot=0;p.forEach(c=>tot+=Math.max(0.05,c._ws||0.05));
    let r=Math.random()*tot,idx=p.length-1;
    for(let j=0;j<p.length;j++){r-=Math.max(0.05,p[j]._ws||0.05);if(r<=0){idx=j;break;}}
    out.push(p[idx].id);p.splice(idx,1);
  }
  return out;
}
function buildPaper(candIds,n,ratio,key){
  let cands=candIds.map(id=>QMAP[id]).filter(Boolean);
  if(key){
    D.practiceRound=D.practiceRound||{};
    let seen=new Set(D.practiceRound[key]||[]);
    let fresh=cands.filter(q=>!seen.has(q.id));
    if(fresh.length<n){ seen=new Set(); D.practiceRound[key]=[]; fresh=cands; }
    cands=fresh;
  }
  if(!cands.length)return [];
  const prof=weakProfile();
  cands.forEach(q=>{q._ws=weakScore(q,prof);});
  const weakN=Math.max(0,Math.min(n,Math.round(n*(ratio==null?0.4:ratio))));
  const picked=[];
  const mdModels=Object.entries(prof.md).sort((a,b)=>b[1]-a[1]);
  const byModel={};cands.forEach(q=>{(byModel[q.m]=byModel[q.m]||[]).push(q);});
  if(mdModels.length){
    const totalF=mdModels.reduce((s,x)=>s+x[1],0);
    let quotaLeft=weakN;
    mdModels.forEach((m,i)=>{
      if(quotaLeft<=0)return;
      const pool0=(byModel[m[0]]||[]).filter(q=>!picked.includes(q.id)&&q._ws>0);
      // 同模型内同模板（仅数字不同）只留 1 道，避免同类题扎堆
      const tmpS={};const pool=[];
      pool0.forEach(q=>{const s=q.q.replace(/[0-9]+/g,'N');if(!tmpS[s]){tmpS[s]=1;pool.push(q);}});
      let qq=(i===mdModels.length-1)?quotaLeft:Math.max(0,Math.round(weakN*m[1]/totalF));
      qq=Math.min(qq,pool.length,quotaLeft);
      pickWeighted(pool,qq).forEach(id=>picked.push(id));
      quotaLeft-=qq;
    });
    if(quotaLeft>0){
      const pool=cands.filter(q=>!picked.includes(q.id)&&q._ws>0).sort((a,b)=>b._ws-a._ws);
      pickWeighted(pool,Math.min(quotaLeft,pool.length)).forEach(id=>picked.push(id));
    }
  }else{
    const pool=cands.filter(q=>!picked.includes(q.id)&&q._ws>0);
    pickWeighted(pool,Math.min(weakN,pool.length)).forEach(id=>picked.push(id));
  }
  // 全新普通题：按模型轮询分散 + 上次抽过降权（新鲜度）
  const freshN=n-picked.length;
  const lastIds=new Set((D.lastSet&&D.lastSet.ids)||[]);
  const rest=cands.filter(q=>!picked.includes(q.id));
  const byM2={};rest.forEach(q=>{(byM2[q.m]=byM2[q.m]||[]).push(q);});
  const ms=Object.keys(byM2).sort(()=>Math.random()-0.5);
  let mi=0;
  while(picked.length<n&&rest.length){
    // 轮询模型，每个模型本轮最多取 1 题；一轮完重新打乱
    const cur=byM2[ms[mi%ms.length]];
    if(cur){
      let tot=0;cur.forEach(q=>tot+=lastIds.has(q.id)?0.3:1);
      let r=Math.random()*tot,idx=cur.length-1;
      for(let j=0;j<cur.length;j++){r-=lastIds.has(cur[j].id)?0.3:1;if(r<=0){idx=j;break;}}
      const q=cur[idx];
      picked.push(q.id);
      cur.splice(idx,1);
      const ri=rest.indexOf(q);if(ri>=0)rest.splice(ri,1);
    }
    mi++;
    if(mi%ms.length===0&&picked.length<n&&rest.length)ms.sort(()=>Math.random()-0.5);
  }
  // 打乱顺序，避免同类题扎堆
  for(let i=picked.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[picked[i],picked[j]]=[picked[j],picked[i]];}
  D.lastSet={ts:Date.now(),ids:picked};
  if(key){D.practiceRound=D.practiceRound||{};D.practiceRound[key]=(D.practiceRound[key]||[]).concat(picked);}
  store.save();
  return picked;
}
function paperPreview(candIds,n,ratio){
  const cands=candIds.map(id=>QMAP[id]).filter(Boolean);
  if(!cands.length)return {total:0,weak:0,fresh:0};
  const prof=weakProfile();cands.forEach(q=>{q._ws=weakScore(q,prof);});
  const weakN=Math.max(0,Math.min(n,Math.round(n*(ratio==null?0.4:ratio))));
  const weakAvail=cands.filter(q=>q._ws>0).length;
  const weak=Math.min(weakN,weakAvail);
  return {total:n,weak,fresh:n-weak};
}


/* ============ 计算训练 / 每日计算任务 ============ */
/* 计算抽题：同难度内优先不同知识点，其次不同题干 */
function calcPick(bank, n, level){
  const pool=bank.filter(q=>q.l===level);
  const byK={};
  pool.forEach(q=>{(byK[q.k]=byK[q.k]||[]).push(q);});
  const ks=Object.keys(byK).sort(()=>Math.random()-0.5);
  const picked=[]; const usedQ=new Set();
  for(const k of ks){
    if(picked.length>=n) break;
    const cands=byK[k].filter(q=>!usedQ.has(q.q));
    if(cands.length){
      const q=cands[Math.floor(Math.random()*cands.length)];
      picked.push(q); usedQ.add(q.q);
    }
  }
  while(picked.length<n){
    const rest=pool.filter(q=>!usedQ.has(q.q));
    if(!rest.length) break;
    const q=rest[Math.floor(Math.random()*rest.length)];
    picked.push(q); usedQ.add(q.q);
  }
  while(picked.length<n){
    const rest=pool.filter(q=>!picked.includes(q));
    if(!rest.length) break;
    picked.push(rest[Math.floor(Math.random()*rest.length)]);
  }
  return picked;
}

function vDailyCalc(){

  if(D.calc.lastDate!==today){
    if(D.calc.lastDate && !D.calc.done && !D.calc.failed) D.calc.streak=0;
    D.calc.lastDate=today; D.calc.done=false; D.calc.failed=false; D.calc.round=0;
    D.calc.startedAt=null; D.calc.qs=[]; D.calc.plan=null; D.calc.review=false; D.calc.answers={};
    if(calcTimer){clearInterval(calcTimer);calcTimer=null;}
    store.save();
  }
  // 阶段定义
  const STAGES={
    "g7-1":"七上·有理数基础计算","g7-2":"七上·整式加减","g7-3":"七上·一元一次方程","g7-4":"七下·二元一次方程组","g7-5":"七下·一元一次不等式",
    "g8-1":"八下·二次根式","g8-2":"八上·整式乘除与因式分解","g8-3":"八上·分式","g8-4":"八下·一次函数",
    "g9-1":"九上·一元二次方程","g9-2":"九上·二次函数","g9-3":"九下·圆相关计算","g9-4":"九下·锐角三角函数"
  };
  if(!D.calc.stage) D.calc.stage=D.profile.grade==='g8'?'g8-1':D.profile.grade==='g9'?'g9-1':'g7-1';

  let html='<h1 class="page-title">计算训练</h1><p class="page-sub">每日计算任务：5 题一组，1 普通 + 2 提优 + 2 挑战，全对得 10 积分。</p>';
  if(D.calc.failed){
    html+='<div class="card" style="text-align:center;padding:40px"><h3 style="margin:12px 0">今日计算任务已超时失败</h3><p style="color:var(--sub);margin-bottom:16px">已发放 5 积分安慰奖，明天再来挑战！</p><p style="font-size:13px;color:var(--sub)">连续首轮通关：'+D.calc.streak+' 天</p></div>';
    V.innerHTML=html; return;
  }
  if(D.calc.done && !D.calc.review){
    html+='<div class="card" style="text-align:center;padding:40px"><h3 style="margin:12px 0">今日计算任务已完成！</h3><p style="color:var(--sub)">本轮用时 '+D.calc.lastUsed+'，获得 10 积分</p><p style="font-size:13px;color:var(--sub);margin-top:8px">连续首轮通关：'+D.calc.streak+' 天</p></div>';
    V.innerHTML=html; return;
  }
  if(!D.calc.startedAt){
    let normalN=1,toughN=2,hardN=2;
    if(D.calc.streak>=2){normalN=0;toughN=2;hardN=3;}
    D.calc.plan={normalN,toughN,hardN};
    // 阶段选择
    html+='<div class="card" style="margin-bottom:14px"><div style="font-weight:600;margin-bottom:10px">选择计算阶段</div><select id="calcStage" style="width:100%;padding:8px;border:px solid #ddd;border-radius:6px;font-size:14px">';
    for(const k in STAGES){
      const n=(CALC_BANK[k]||[]).length;
      html+='<option value="'+k+'"'+(D.calc.stage===k?' selected':'')+'>'+STAGES[k]+'（'+n+' 题）</option>';
    }
    html+='</select></div>';
    html+='<div class="card" style="text-align:center;padding:30px"><h3 style="margin-bottom:10px">今日计算任务</h3><p style="color:var(--sub);margin-bottom:20px">5 题一组：'+normalN+' 普通 + '+toughN+' 提优 + '+hardN+' 挑战<br>1 小时内全对得 10 积分，超时得 5 积分</p><button class="btn btn-primary" onclick="startDailyCalc()" style="font-size:16px;padding:12px 40px">开始今日任务</button><p style="margin-top:16px;font-size:13px;color:var(--sub)">连续首轮通关：'+D.calc.streak+' 天</p></div>';
  } else {
    const elapsed=Math.floor((Date.now()-D.calc.startedAt)/1000);
    const remain=Math.max(0,3600-elapsed);

      const wrongN=D.calc.qs.filter((q,i)=>D.calc.answers[i]!==String(q.a).replace(/\s/g,'')).length;
      if(!D.calc.allCorrect) html+='<p style="font-size:13px;color:var(--sub);margin-top:4px">答错 '+wrongN+' 题，查看解析后进入下一组继续挑战。</p>';
      html+='</div>';

        html+='<div style="text-align:center;margin-top:16px"><button class="btn btn-primary" onclick="finishCalcReview()">完成今日任务</button></div>';
      } else {
        html+='<div style="text-align:center;margin-top:16px"><button class="btn btn-primary" onclick="nextCalcRound()">查看完毕，进入下一组</button></div>';
      }
    } else {
      // 答题页
      html+='<div class="card" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center"><b>倒计时</b><span id="calcTimer" style="font-size:28px;font-weight:700;color:var(--primary);font-family:monospace">'+mm+':'+ss+'</span><span style="font-size:13px;color:var(--sub)">第 '+D.calc.round+' 轮</span></div>';
      html+='<div id="calcQuiz"></div>';
      html+='<div style="text-align:center;margin-top:16px"><button class="btn btn-primary" onclick="submitDailyCalc()">提交本组</button></div>';
    }
  }
  V.innerHTML=html;
  if(D.calc&&D.calc.startedAt&&!D.calc.done&&!D.calc.failed){
    if(D.calc.review){ renderCalcReview(); } else { renderCalcQuiz(); }
    if(calcTimer) clearInterval(calcTimer);
    calcTimer=setInterval(function(){
      const el=Math.floor((Date.now()-D.calc.startedAt)/1000);
      if(el>=3600){
        clearInterval(calcTimer);
        D.calc.failed=true; D.calc.streak=0;
        ptsAdd(5,"每日计算任务超时奖励"); store.save(); vDailyCalc(); return;
      }
      const remain=3600-el;
      const mm=String(Math.floor(remain/60)).padStart(2,'0');
      const ss=String(remain%60).padStart(2,'0');
      const t=document.getElementById('calcTimer');
      if(t) t.textContent=mm+':'+ss;
    },1000);
  }
}
function startDailyCalc(){
  const sel=document.getElementById('calcStage');
  if(sel) D.calc.stage=sel.value;
  const bank=CALC_BANK[D.calc.stage]||[];
  const plan=D.calc.plan;
  D.calc.startedAt=Date.now();
  D.calc.round=1;
  D.calc.review=false; D.calc.answers={}; D.calc.allCorrect=false;
  D.calc.qs=[...calcPick(bank,plan.normalN,'普通'),...calcPick(bank,plan.toughN,'提优'),...calcPick(bank,plan.hardN,'挑战')];
  store.save(); vDailyCalc();
}

function submitDailyCalc(){
  const ans={}; let allCorrect=true;
  D.calc.qs.forEach((q,i)=>{
    const val=(document.getElementById('calcAns'+i).value||'').trim();

  });
  D.calc.answers=ans; D.calc.allCorrect=allCorrect; D.calc.review=true;

  if(sess.mode==='exam')startTimer();
}
function pickOpt(i){const q=curQ();saveAnswer(q,'ABCD'[i]);vQuiz();}
function saveFill(v){const q=curQ();saveAnswer(q,v);}
function savePtsCB(){
  const q=curQ();const cbs=$$('.pt-check input');
  const ptsPts=cbs.map((c,i)=>c.checked?i:null).filter(x=>x!==null);
  const sum=ptsPts.reduce((s,i)=>{const pp=q.p||[];return s+(pp[i]?pp[i][1]:0);},0);
  const a=sess.answers[q.id]||{v:''};a.ptsPts=ptsPts;a.pts=sum;a.v=a.v||'';sess.answers[q.id]=a;
  const el=$('#ptsSum');if(el)el.textContent=sum;
}
function navQ(d){sess.i=Math.max(0,Math.min(sess.items.length-1,sess.i+d));vQuiz();}
function jumpQ(i){sess.i=i;vQuiz();}
function quitQuiz(){if(confirm('退出本次作答？已答内容不会保存。')){sess=null;location.hash='#/home';}}
function startTimer(){
  if(timerInt)clearInterval(timerInt);
  const tick=()=>{
    const left=sess?Math.max(0,sess.deadline-Date.now()):0;
    const pill=$('#timerPill');
    if(pill){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);pill.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');pill.classList.toggle('warn',left<300000);}
    if(left<=0&&sess){clearInterval(timerInt);toast('时间到，自动交卷');submitQuiz(true);}
  };
  tick();timerInt=setInterval(tick,1000);
}
function submitQuiz(auto){
  if(!sess)return;
  const unanswered=sess.items.filter(id=>{const a=sess.answers[id];return !a||a.v===null||a.v==='';}).length;
  if(unanswered>0&&!auto){if(!confirm('还有 '+unanswered+' 题未作答，确定提交？'))return;}
  if(timerInt)clearInterval(timerInt);
  const out=commitSession();
  if(out){renderResult(out);}
}

/* ============ 结果页 ============ */
function vResult(){
  if(lastOut){renderResult(lastOut);return;}
  location.hash='#/home';
}
function bestLineFor(score){
  return score>=145?'已达成 145+ 目标线，保持手感，冲刺满分！'
    :score>=135?'距离 145+ 只差一步，重点复盘压轴题与易错点。'
    :score>=120?'基础与中档基本稳固，专项突破压轴题型是下一阶段重点。'
    :'优先回归基础巩固，保障选择填空零失误后再挑战中档与压轴。';
}
function resSelfPts(ri,pi,on){
  const out=lastOut;const it=out.res[ri];if(!it)return;
  const q=it.q,g=it.g,ans=it.ans;
  ans.ptsPts=ans.ptsPts||[];const idx=ans.ptsPts.indexOf(pi);
  if(on&&idx<0)ans.ptsPts.push(pi);if(!on&&idx>=0)ans.ptsPts.splice(idx,1);
  const max=(q.p||[]).reduce((s,x)=>s+x[1],0);
  ans.pts=ans.ptsPts.reduce((s,x)=>s+((q.p||[])[x]?q.p[x][1]:0),0);
  const prevOk=g.ok;
  g.score=Math.max(0,Math.min(max,ans.pts||0));g.max=max;g.ok=g.score>=max;
  out.score=out.res.reduce((s,x)=>s+x.g.score,0);
  out.correct=out.res.filter(x=>x.g.ok).length;
  const rec=it.recIdx!=null?D.records[it.recIdx]:null;if(rec){rec.score=g.score;rec.ok=g.ok;rec.max=g.max;}
  const sessRec=out.sessIdx!=null?D.sessions[out.sessIdx]:null;if(sessRec){sessRec.score=out.score;sessRec.correct=out.correct;}
  if(g.ok&&!prevOk){const w=D.wrongs[q.id];if(w){w.n=Math.max(0,(w.n||1)-1);if(w.n===0)delete D.wrongs[q.id];else w.ok=false;}}
  else if(!g.ok&&prevOk){const w=D.wrongs[q.id]||{n:0,last:0,ok:false};w.n++;w.last=Date.now();w.ok=false;D.wrongs[q.id]=w;}
  store.save();
  const sumEl=$('#resSum-'+ri);if(sumEl)sumEl.textContent=ans.pts;
  const sc=$('#resScore-'+ri);if(sc)sc.textContent=g.score;
  const tag=$('#resTag-'+ri);if(tag){tag.textContent=g.ok?'正确':'错误';tag.className='tag '+(g.ok?'correct':'wrong');}
  const hs=$('#resHeroScore');if(hs)hs.textContent=out.score;
  const rate=$('#resRate');if(rate)rate.textContent='正确 '+out.correct+' 题 / 共 '+out.res.length+' 题 · 正确率 '+Math.round(out.score/out.total*100)+'%';
  const gl=$('#resGradeLine');if(gl)gl.textContent=bestLineFor(out.score);
  toast(g.ok?'已按满分计入，本题判定为正确':'自评得分已更新');
}
function renderResult(out){
  lastOut=out;
  const rate=out.total?Math.round(out.score/out.total*100):0;
  const bestLine=bestLineFor(out.score);
  let html=`<div class="card score-hero">
    <div class="num"><b id="resHeroScore" style="font-weight:inherit">${out.score}</b><small> / ${out.total} 分</small></div>
    <div style="margin:6px 0;font-size:14px" id="resRate">正确 ${out.correct} 题 / 共 ${out.res.length} 题 · 正确率 ${rate}%</div>
    <div class="grade-line" id="resGradeLine">${bestLine}</div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="location.hash='#/home'">返回首页</button>
      <button class="btn btn-ghost" onclick="location.hash='#/wrong'">查看错题本</button>
      ${sess&&false?'':''}
    </div>
  </div>`;
  out.res.forEach(({q,g,ans},i)=>{
    const yourAns=q.t==='c'?(ans.v?ans.v+'（'+String(q.o[ans.v.charCodeAt(0)-65]||'').replace(/^[A-D][.、．]\s*/,'')+'）':'未作答')
      :q.t==='f'?(ans.v||'未作答'):'解答过程（已记录）';
    html+=`<div class="res-item">
      <div class="head">
        <span class="tag ${g.ok?'correct':'wrong'}" id="resTag-${i}">${g.ok?'正确':'错误'}</span>
        <span class="tag ${q.t==='c'?'':''}">${q.t==='c'?'选择':q.t==='f'?'填空':'解答'}${q.h?' · 芜湖高频':''}</span>
        <span class="tag">${esc(q.k||'')}</span>
        <span style="margin-left:auto;font-size:13px;color:var(--sub)">得分 <b id="resScore-${i}">${g.score}</b>/${g.max}</span>
      </div>
      <div class="q">${i+1}. ${fmtMath(q.q)}</div>
      ${q.t==='a'?`<div class="res-pts" id="resPts-${i}" style="margin-top:10px;padding:10px 12px;background:var(--bg,#f7f9fc);border-radius:10px">
        <div style="font-size:13px;font-weight:600;margin-bottom:6px">对照得分要点自评（提交后计入得分）</div>
        ${(q.p||[]).map((p,pi)=>`<label class="pt-check"><input type="checkbox" data-pt="${pi}" ${ans.ptsPts&&ans.ptsPts.includes(pi)?'checked':''} onchange="resSelfPts(${i},${pi},this.checked)"><span>${esc(p[0])}</span><span class="pv">${p[1]} 分</span></label>`).join('')}
        <div style="font-size:12.5px;color:var(--sub);margin-top:6px">自评合计：<b id="resSum-${i}" style="color:var(--primary-d)">${ans.pts||0}</b> / ${g.max} 分</div>
      </div>`:''}
      ${q.t==='a'?'':`<div class="res-line">你的答案：<b>${esc(yourAns)}</b></div>`}
      ${g.ok?'':`<div class="res-line">正确答案：<b style="color:var(--ok)">${fmtMath(q.a)}</b></div>`}
      <details class="detail-box"><summary>查看解析（解题步骤 · 得分要点 · 易错点）</summary>
        <div class="body">
          <div><b>解题过程：</b><br>${fmtMath(q.s||'')}</div>
          ${q.p&&q.p.length?`<div class="pts"><b>得分要点（严格对标中考阅卷）：</b><ul>${q.p.map(p=>`<li>${fmtMath(p[0])}（${p[1]} 分）</li>`).join('')}</ul></div>`:''}
          ${q.e?`<div style="margin-top:6px"><b>高频易错：</b>${fmtMath(q.e)}</div>`:''}
        </div>
      </details>
    </div>`;
  });
  html+=`<div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="location.hash='#/practice'">再练一组</button>
    <button class="btn btn-ghost" onclick="location.hash='#/exam'">进入模考</button>
    <button class="btn btn-ghost" onclick="location.hash='#/report'">查看学情报告</button>
  </div>`;
  V.innerHTML=html;
  location.hash='#/result';
}

/* ============ 错题本 ============ */

  let html=`<h1 class="page-title">错题本</h1><p class="page-sub">错题自动归集，支持分类筛选、专项重做与标记掌握，彻底攻克薄弱题型。</p>

    </select>
    <select class="q-input" style="width:auto;padding:7px 10px" onchange="wFilter.grade=this.value;vWrong()">
      <option value="all" ${wFilter.grade==='all'?'selected':''}>全部学段</option>
      <option value="g7" ${wFilter.grade==='g7'?'selected':''}>七年级</option>

function toggleWrongDetail(id){const el=$('#wd-'+id);if(el)el.style.display=el.style.display==='none'?'block':'none';}

function redoOne(id){startSession('redo','错题重做',[id],'wrong');}
function redoAll(){

/* ============ 学情报告 ============ */
function vReport(){
  const recs=D.records;
  if(!recs.length){
    V.innerHTML=`<h1 class="page-title">学情报告</h1><p class="page-sub">基于你的全部答题数据进行智能学情诊断。</p>
    <div class="card empty"><div class="big">📊</div><b>还没有答题数据</b><p style="margin-top:6px">先去分层练习或套卷模考完成一组题目，即可生成专属学情诊断。</p>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" onclick="location.hash='#/practice'">去练习</button><button class="btn btn-ghost" onclick="location.hash='#/exam'">去模考</button></div></div>`;
    return;
  }
  const tot=recs.length,ok=recs.filter(r=>r.ok).length,rate=Math.round(ok/tot*100);
  const wrongIds=Object.keys(D.wrongs).filter(id=>!D.wrongs[id].ok).length;
  const exams=D.sessions.filter(s=>s.mode==='exam');
  const avg=exams.length?Math.round(exams.reduce((s,e)=>s+e.score,0)/exams.length):'--';
  const best=exams.length?Math.max(...exams.map(s=>s.score)):'--';
  const doms=['数与式','方程与不等式','函数','图形与几何','统计与概率'];
  const domData=doms.map(d=>{const rs=recs.filter(r=>r.dom===d);return {d,t:rs.length,ok:rs.filter(r=>r.ok).length};});
  const radarVals=domData.map(x=>x.t?Math.round(x.ok/x.t*100)/100:0);
  const chapData={};recs.forEach(r=>{if(r.cat==='exam')return;chapData[r.cat]=chapData[r.cat]||{t:0,ok:0};chapData[r.cat].t++;if(r.ok)chapData[r.cat].ok++;});
  const chapErr=Object.entries(chapData).filter(([k,v])=>v.t>=2).map(([k,v])=>({k,err:Math.round((v.t-v.ok)/v.t*100)})).sort((a,b)=>b.err-a.err).slice(0,8);
  const sess8=D.sessions.slice(-8);
  const trendLabels=sess8.map((s,i)=>'第'+(D.sessions.indexOf(s)+1)+'次');
  const trendVals=sess8.map(s=>Math.round(s.correct/s.total*100));
  const weakKP={};recs.filter(r=>!r.ok).forEach(r=>{weakKP[r.kp]=weakKP[r.kp]||{n:0,t:0};weakKP[r.kp].n++;});recs.forEach(r=>{if(!weakKP[r.kp])weakKP[r.kp]={n:0,t:0};weakKP[r.kp].t++;});
  const weakTop=Object.entries(weakKP).filter(([k,v])=>v.n>=1).sort((a,b)=>b.n-a.n).slice(0,6);
  const traps={};recs.filter(r=>!r.ok&&r.trap).forEach(r=>{traps[r.trap]=(traps[r.trap]||0)+1;});
  const trapTop=Object.entries(traps).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const weakDom=domData.filter(x=>x.t>=3).sort((a,b)=>a.ok/a.t-b.ok/b.t)[0];
  const suggestions=[];
  if(weakDom)suggestions.push(`「${weakDom.d}」领域掌握度偏低（${Math.round(weakDom.ok/weakDom.t*100)}%），建议优先通过基础巩固模式同步复习对应章节，再进入专题突破。`);
  if(trapTop.length)suggestions.push(`注意规避高频陷阱：${trapTop.map(t=>t[0]).join('、')}——这类题目往往一步失误即全题丢分。`);
  if(chapErr.length)suggestions.push(`错误率最高的章节为「${chapName(chapErr[0].k)}」（错误率 ${chapErr[0].err}%），建议集中重做该章错题并回归课本例题。`);
  if(wrongIds)suggestions.push(`错题本中还有 ${wrongIds} 道待攻克题目，坚持「重做—掌握」循环，重复错误是高分最大的敌人。`);
  if(avg!=='--')suggestions.push(avg>=145?'模考已稳定 145+，冲刺阶段保持每周 1–2 次全真模考并复盘压轴题。':avg>=135?`模考均分 ${avg}，距离 145+ 约差 ${145-avg} 分，优先攻克填空第 14 题与解答 22/23 题压轴。`:`模考均分 ${avg}，先确保选择填空 60 分零失误，再逐题突破中档解答题。`);
  V.innerHTML=`
  <h1 class="page-title">学情报告</h1><p class="page-sub">自动统计全部答题数据，精准定位薄弱点与提分空间（数据仅存本地）。</p>
  <div class="grid stat-row">
    <div class="card stat-card"><b>${tot}</b><span>累计答题</span></div>
    <div class="card stat-card"><b>${rate}%</b><span>综合正确率</span></div>
    <div class="card stat-card"><b>${wrongIds}</b><span>待攻克错题</span></div>
    <div class="card stat-card"><b>${avg}</b><span>模考均分 / 最佳 ${best}</span></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,fr));margin-top:16px">
    <div class="card"><h3 style="font-size:15px;margin-bottom:8px">五大知识领域掌握度</h3><div class="radar-wrap"><canvas id="cRadar" height="260"></canvas></div></div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:8px">章节错误率 Top</h3><div id="barArea" style="margin-top:12px"></div></div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3 style="font-size:15px;margin-bottom:4px">近期练习正确率趋势</h3>
    <canvas id="cTrend" height="200"></canvas>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,fr));margin-top:16px">
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:8px">薄弱知识点定位</h3>
      ${weakTop.length?`<ul class="weak-list">${weakTop.map(([k,v])=>`<li><span>${esc(k)}（共 ${v.t} 题）</span><span class="pct">错 ${v.n} 题</span></li>`).join('')}</ul>`:'<div style="color:var(--sub);font-size:13px">暂无数据，完成更多练习后自动生成。</div>'}
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:8px">芜湖高频陷阱统计</h3>
      ${trapTop.length?`<ul class="weak-list">${trapTop.map(([k,v])=>`<li><span>${esc(k)}</span><span class="pct">触发 ${v} 次</span></li>`).join('')}</ul>`:'<div style="color:var(--sub);font-size:13px">暂无记录，注意每道题的「陷阱」标签提示。</div>'}
      <h3 style="font-size:15px;margin:16px 0 8px">个性化提分建议</h3>
      <ul class="sug-list">${suggestions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
    </div>
  </div>`;
  requestAnimationFrame(()=>{
    const repaint=()=>{
      const cv1=$('#cRadar');if(cv1)chartRadar(cv1,doms,radarVals);
      const bar=$('#barArea');
      if(bar){
        if(chapErr.length){

          chartBars(cv,chapErr.map(x=>chapName(x.k)),chapErr.map(x=>x.err),'#d64545',chapErr.map((x,i)=>x.err>=40?i:-1).filter(i=>i>=0));
        }else bar.innerHTML='<div style="color:var(--sub);font-size:13px">单章节答题不足 2 题，暂不统计。</div>';
      }
      const cv3=$('#cTrend');if(cv3)chartLine(cv3,trendLabels,trendVals);
    };
    window.__repaint=repaint;
    repaint();
  });
  if(!window.__repaintBound){
    window.__repaintBound=true;
    window.addEventListener('resize',()=>{
      if(location.hash==='#/report'&&window.__repaint){
        clearTimeout(window.__repaintT);
        window.__repaintT=setTimeout(window.__repaint,120);
      }
    });
  }
}

        <input type="file" id="inFile" accept=".json" style="display:none" onchange="importData(this)">

      工具说明：题库为自主原创变式题，仅借鉴《实验班提优训练》《学霸》两套教辅的章节体系、难度梯度与出题逻辑，不含任何教辅原题；内容适配芜湖中考（安徽统一命题）考情。

function ghLog(msg,color){
  const el=$('#ghLog');if(!el)return;
  const t=new Date().toLocaleTimeString();
  el.innerHTML=`<div style="color:${color||'var(--sub)'}">[${t}] ${esc(msg)}</div>`+el.innerHTML;
}
function ghCfg(){
  const tok=localStorage.getItem('xsx_gh_token')||'';
  const u=store.curUser();
  const name=(u.name||'').trim()||'默认用户';
  return {tok, owner:'laolianzi-reading', repo:'xiaoshuxue-data', path:'users/'+encodeURIComponent(name)+'.json', name, uid:u.id};
}
function ghSaveToken(){localStorage.setItem('xsx_gh_token',$('#inGhToken').value.trim());toast('Token 已保存');render('users');}
async function ghTest(){
  const c=ghCfg();if(!c.tok){toast('请先填写 Token');return;}
  ghLog('测试连接中…');
  try{
    const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}`,{headers:{Authorization:'token '+c.tok,Accept:'application/vnd.github+json'}});
    if(r.status===200){ghLog('连接成功：仓库可访问','#2e9e5b');toast('连接成功');}
    else{const j=await r.json().catch(()=>({}));ghLog('连接失败：'+r.status+' '+(j.message||''),'#c0392b');toast('连接失败');}
  }catch(e){ghLog('网络错误：'+e.message,'#c0392b');}
}
async function ghGetRemote(c){
  // 返回 {sha, data} 或 null（远程不存在）
  const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}`,{headers:{Authorization:'token '+c.tok,Accept:'application/vnd.github+json'}});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  const bin=atob(j.content.replace(/\n/g,''));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const data=JSON.parse(new TextDecoder('utf-8').decode(bytes));
  return {sha:j.sha, data};
}
function mergeUsers(local,remote){
  const base=JSON.parse(JSON.stringify(local));
  // records 按 ts+qid 去重合并
  const rm={};
  (remote.records||[]).forEach(r=>rm[r.ts+'|'+r.qid]=r);
  (base.records||[]).forEach(r=>rm[r.ts+'|'+r.qid]=r);
  base.records=Object.values(rm).sort((a,b)=>(a.ts||0)-(b.ts||0));
  // sessions 按 ts
  const sm={};
  (remote.sessions||[]).forEach(s=>sm[s.ts]=s);
  (base.sessions||[]).forEach(s=>sm[s.ts]=s);
  base.sessions=Object.values(sm).sort((a,b)=>(a.ts||0)-(b.ts||0));
  // wrongs 按 qid，n/last 取 max
  const wm={};
  Object.keys(remote.wrongs||{}).forEach(k=>wm[k]={...remote.wrongs[k]});
  Object.keys(base.wrongs||{}).forEach(k=>{
    const r=wm[k]||{n:0,last:0,ok:false};
    const l=base.wrongs[k];
    wm[k]={n:Math.max(r.n||0,l.n||0),last:Math.max(r.last||0,l.last||0),ok:!!(r.ok||l.ok)};
  });
  base.wrongs=wm;
  // points: total/streak 取 max，logs 合并
  if(remote.points){
    if(!base.points) base.points=JSON.parse(JSON.stringify(remote.points));
    else{
      base.points.total=Math.max(base.points.total||0,remote.points.total||0);
      base.points.streak=Math.max(base.points.streak||0,remote.points.streak||0);
      base.points.last=Math.max(base.points.last||0,remote.points.last||0);
      base.points.ms={...(remote.points.ms||{}),...(base.points.ms||{})};
      const lm={};
      (remote.points.logs||[]).forEach(x=>lm[(x.date||0)+'|'+(x.pts||0)+'|'+(x.note||'')]=x);
      (base.points.logs||[]).forEach(x=>lm[(x.date||0)+'|'+(x.pts||0)+'|'+(x.note||'')]=x);
      base.points.logs=Object.values(lm).sort((a,b)=>(a.date||0)-(b.date||0));
    }
  }
  // avatar: 取最新的
  if(remote.avatar) base.avatar=remote.avatar;
  // calc: 取 lastDate 更新
  if(remote.calc && (!base.calc || (remote.calc.lastDate||'') > (base.calc.lastDate||''))) base.calc=remote.calc;
  // 全局修复历史乱码字符串
  const fixStr=s=>{if(typeof s!=='string'||!s)return s;if(!/[\u00c0-\u00ff]/.test(s))return s;try{const bytes=new Uint8Array(s.length);for(let i=0;i<s.length;i++)bytes[i]=s.charCodeAt(i)&0xFF;const f=new TextDecoder('utf-8',{fatal:false}).decode(bytes);if(f!==s)return f;}catch(e){}return s;};
  const walk=o=>{if(typeof o==='string')return fixStr(o);if(Array.isArray(o))return o.map(walk);if(o&&typeof o==='object'){for(const k in o)o[k]=walk(o[k]);}return o;};
  walk(base);
  return base;
}
async function ghPush(confirmFirst){
  const c=ghCfg();if(!c.tok){toast('请先填写 Token');return;}
  if(confirmFirst && !confirm('将本机数据与云端合并后上传，继续？')) return;
  const btn=$('#btnPush');if(btn){btn.disabled=true;btn.textContent='上传中…';}
  ghLog('开始上传：读取云端…');
  try{
    let remote=null;
    try{remote=await ghGetRemote(c);}catch(e){ghLog('读取云端失败：'+e.message,'#c0392b');}
    const local=store.cur;
    let merged;
    if(remote){
      ghLog('云端已有数据（'+(remote.data.records||[]).length+' 条记录），合并中…');
      merged=mergeUsers(local,remote.data);
    }else{
      ghLog('云端无此用户数据，首次上传');
      merged=local;
    }
    const localAv=store.curUser().avatar||store.cur.avatar||'';
    merged.avatar=localAv||merged.avatar||'';
    ghLog(merged.avatar?'头像已包含（'+Math.round(merged.avatar.length/1024)+'KB）':'未设置头像（localAv='+(localAv?'有':'空')+'）');
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(merged,null,2))));
    const body={message:'sync '+new Date().toISOString(), content, branch:'main'};
    if(remote) body.sha=remote.sha;
    const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}`,{
      method:'PUT', headers:{Authorization:'token '+c.tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(r.ok){
      const j=await r.json();
      ghLog('上传成功：commit '+j.commit.sha.slice(0,7),'#2e9e5b');
      toast('已同步到云端');
    }else{
      const j=await r.json().catch(()=>({}));
      ghLog('上传失败：'+r.status+' '+(j.message||''),'#c0392b');
    }
  }catch(e){ghLog('上传异常：'+e.message,'#c0392b');}
  if(btn){btn.disabled=false;btn.textContent='同步到云端（上传合并）';}
}
async function ghPull(confirmFirst){
  const c=ghCfg();if(!c.tok){toast('请先填写 Token');return;}
  if(confirmFirst && !confirm('将云端数据合并到本机，继续？')) return;
  const btn=$('#btnPull');if(btn){btn.disabled=true;btn.textContent='拉取中…';}
  ghLog('开始拉取…');
  try{
    const remote=await ghGetRemote(c);
    if(!remote){ghLog('云端无此用户数据','#c0392b');toast('云端无数据');return;}
    ghLog('云端数据：'+(remote.data.records||[]).length+' 条记录，合并到本机…');
    const merged=mergeUsers(store.cur,remote.data);
    store.data.data[store.data.active]=merged;
    store.cur=merged;
    D=merged;
    if(merged.avatar){store.curUser().avatar=merged.avatar;ghLog('云端头像已同步');}
    else{ghLog('云端数据无头像字段');}
    store.save();
    updateNavUser();
    ghLog('拉取合并完成，本机已更新','#2e9e5b');
    toast('已从云端拉取');
    render('users');
  }catch(e){ghLog('拉取异常：'+e.message,'#c0392b');}
  if(btn){btn.disabled=false;btn.textContent='从云端拉取（合并到本机）';}
}
function setGrade(g){D.profile.grade=g;store.save();vSettings();}
function exportData(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='小数学-学习数据.json';a.click();
  URL.revokeObjectURL(a.href);toast('数据已导出');
}
function importData(input){
  const f=input.files&&input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);if(j&&typeof j==='object'&&Array.isArray(j.records)){D.profile=j.profile||D.profile;D.records=j.records||[];D.wrongs=j.wrongs||{};D.sessions=j.sessions||[];store.save();toast('导入成功');vSettings();}else toast('文件格式不正确');}catch(e){toast('导入失败：无效 JSON');}};
  rd.readAsText(f);
}
function resetData(){
  if(confirm('确定清空全部学习数据？此操作不可恢复。')){store.reset();D.profile.grade='g9';toast('已清空');location.hash='#/home';}
}
